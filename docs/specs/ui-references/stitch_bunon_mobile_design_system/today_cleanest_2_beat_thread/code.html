md bg-primary flex items-center justify-center text-on-primary font-headline-sm text-headline-sm leading-none">B</div><span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-semibold">Bunon</span></div><div class="flex items-center gap-2.5"><button aria-label="Notifications" class="relative w-11 h-11 flex items-center justify-center text-on-surface active:opacity-60 transition-opacity"><span class="material-symbols-outlined text-[22px]">notifications</span><span class="absolute top-2.5 right-2.5 w-1.5 h-1.5 rounded-full bg-primary"></span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-20 bg-surface"><div class="flex flex-col w-full max-w-[428px] mx-auto px-4 pt-3 pb-8">

<div class="flex justify-between items-center mb-3 px-1 text-on-surface-variant font-label-md text-label-md">
<button class="flex items-center gap-1 text-on-surface-variant hover:text-on-surface active:opacity-70 transition-colors">
<span>Launch Bunon MVP</span>
<span class="material-symbols-outlined text-[16px] leading-none">keyboard_arrow_down</span>
</button>
<span class="text-secondary font-label-sm text-label-sm">Week 2 · Day 10</span>
</div>
<!-- Breathable Hero Task Card -->
<section class="bg-surface-container-lowest rounded-[24px] p-6">
<!-- Top Metadata -->
<div class="flex items-center justify-between mb-3 text-secondary font-label-sm text-label-sm">
<span>45 min · Milestone 2</span>
<button aria-label="Task context" class="w-7 h-7 -mr-1.5 rounded-full flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[17px] leading-none">info</span>
</button>
</div>
<!-- Hero Task Title -->
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-6">
      Build the /login Email + Password auth screen
    </h1>
<!-- 2-Beat Vertical Thread Layout -->
<div class="relative">
<!-- Continuous Thread Spine -->
<div class="absolute left-[26px] top-[26px] bottom-[34px] w-[1.5px] bg-surface-container-highest z-0"></div>
<!-- BEAT 1 (DO) -->
<div class="relative z-10 flex items-start gap-3.5 p-3.5 bg-surface-container-low rounded-xl mb-1.5 transition-colors">
<button aria-label="Toggle task step" class="w-5 h-5 rounded-full bg-surface-container-lowest mt-0.5 flex-shrink-0 flex items-center justify-center transition-all" id="step-checkbox">
<span class="w-2.5 h-2.5 rounded-full bg-transparent transition-all" id="step-indicator"></span>
</button>
<div class="flex-1 min-w-0">
<div class="font-label-sm text-label-sm text-secondary mb-0.5">Start here · 15m</div>
<div class="font-headline-sm text-headline-sm text-on-surface leading-snug" id="step-title">
            Create Sign In / Create Account toggle
          </div>
</div>
</div>
<!-- Thread Sub-action -->
<div class="pl-9 mb-4">
<button class="flex items-center gap-0.5 text-secondary hover:text-on-surface font-label-sm text-label-sm transition-colors">
<span>See all 4 steps</span>
<span class="material-symbols-outlined text-[15px] leading-none">keyboard_arrow_down</span>
</button>
</div>
<!-- BEAT 2 (PROVE TO FINISH) -->
<div class="relative z-10 flex items-center gap-3.5 p-3.5 bg-surface-container-low rounded-xl">
<button aria-label="Snap proof with camera" class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center flex-shrink-0 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[19px] leading-none">photo_camera</span>
</button>
<div class="flex-1 min-w-0">
<div class="font-label-md text-label-md text-on-surface font-semibold truncate">Snap proof to finish</div>
<div class="font-body-sm text-body-sm text-secondary truncate">Photo of your working /login screen</div>
</div>
<button class="font-label-sm text-label-sm text-secondary hover:text-on-surface underline-offset-2 hover:underline flex-shrink-0 transition-colors">
          Note / link
        </button>
</div>
</div>
<!-- Card Footer -->
<div class="pt-5 flex justify-center">
<button class="text-secondary hover:text-on-surface font-body-sm text-body-sm transition-colors">
        Stuck or short on time?
      </button>
</div>
</section>
<!-- Below the Card Row -->
<div class="pt-5 flex flex-col items-center gap-3 text-secondary font-body-sm text-body-sm"><button class="flex items-center gap-0.5 text-secondary hover:text-on-surface transition-colors font-medium text-[13px]"><span>Up next this week · 2 more</span><span class="material-symbols-outlined text-[16px] leading-none">keyboard_arrow_down</span></button><button class="text-secondary hover:text-on-surface transition-colors font-medium text-[13px]">+ Add a day note</button></div>
</div>
<script>
  (function() {
    const checkbox = document.getElementById('step-checkbox');
    const indicator = document.getElementById('step-indicator');
    const title = document.getElementById('step-title');
    let completed = false;

    if (checkbox && indicator && title) {
      checkbox.addEventListener('click', () => {
        completed = !completed;
        if (completed) {
          indicator.classList.remove('bg-transparent');
          indicator.classList.add('bg-primary');
          title.classList.add('line-through', 'text-secondary');
          title.classList.remove('text-on-surface');
        } else {
          indicator.classList.remove('bg-primary');
          indicator.classList.add('bg-transparent');
          title.classList.remove('line-through', 'text-secondary');
          title.classList.add('text-on-surface');
        }
      });
    }
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.03)]" data-active-classes="text-primary font-semibold"><div class="flex items-center justify-around h-16 px-4 max-w-[428px] mx-auto"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[64px] min-h-[44px] gap-1 transition-colors duration-150 text-primary font-semibold" data-path="today" href="#"><span class="material-symbols-outlined text-[22px]">calendar_today</span><span class="font-label-sm text-label-sm">Today</span></a><a class="flex flex-col items-center justify-center min-w-[64px] min-h-[44px] gap-1 text-secondary transition-colors duration-150" data-path="roadmap" href="#"><span class="material-symbols-outlined text-[22px]">alt_route</span><span class="font-label-sm text-label-sm">Roadmap</span></a><a class="flex flex-col items-center justify-center min-w-[64px] min-h-[44px] gap-1 text-secondary transition-colors duration-150" data-path="timeline" href="#"><span class="material-symbols-outlined text-[22px]">timeline</span><span class="font-label-sm text-label-sm">Timeline</span></a></div></nav>
