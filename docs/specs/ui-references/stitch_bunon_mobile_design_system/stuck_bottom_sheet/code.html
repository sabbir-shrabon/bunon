<div aria-hidden="true" class="w-full flex flex-col space-y-4 opacity-30 pointer-events-none select-none">

<div>
<p class="font-label-sm text-label-sm text-secondary">Today, Oct 14</p>
<h1 class="font-headline-md text-headline-md text-on-surface">Architectural Cadence</h1>
</div>
<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
</div>
</div>
<!-- Background card representation -->
<div class="w-full bg-surface-container-lowest rounded-[20px] p-6 flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm text-secondary">Current Task</span>
<span class="w-3.5 h-3.5 rounded-full bg-surface-variant"></span>
</div>
<p class="font-headline-sm text-headline-sm text-on-surface">Draft site orientation plan</p>
<div class="w-full h-1.5 bg-surface-container-high rounded-full overflow-hidden mt-2">

</div>
</div>

<div class="fixed inset-0 z-40 bg-black/45 backdrop-blur-[1px] transition-opacity duration-300"></div>

<div class="w-9 h-1 rounded-full bg-surface-variant mt-3 mb-5 mx-auto"></div>

<div class="text-center px-2">

      </h2>
<p class="font-body-sm text-body-sm text-secondary mb-6 px-4">

      </p>
</div>
<!-- Tappable Option Chips -->
<div aria-label="Reasons for feeling stuck" class="flex flex-wrap gap-2.5 justify-center px-1 mb-6" id="chip-group" role="radiogroup">
<button aria-checked="true" class="chip-option bg-surface-container text-on-surface font-label-md text-label-md px-4 py-2.5 rounded-full transition-colors active:scale-95" role="radio" type="button">
        Too tired
      </button>
<button aria-checked="false" class="chip-option bg-surface-container-low text-secondary font-label-md text-label-md px-4 py-2.5 rounded-full hover:text-on-surface transition-colors active:scale-95" role="radio" type="button">
        Didn't understand
      </button>
<button aria-checked="false" class="chip-option bg-surface-container-low text-secondary font-label-md text-label-md px-4 py-2.5 rounded-full hover:text-on-surface transition-colors active:scale-95" role="radio" type="button">
        No time today
      </button>
<button aria-checked="false" class="chip-option bg-surface-container-low text-secondary font-label-md text-label-md px-4 py-2.5 rounded-full hover:text-on-surface transition-colors active:scale-95" role="radio" type="button">
        Doesn't feel useful
      </button>
<button aria-checked="false" class="chip-option bg-surface-container-low text-secondary font-label-md text-label-md px-4 py-2.5 rounded-full hover:text-on-surface transition-colors active:scale-95" role="radio" type="button">
        Don't feel like it
      </button>
</div>
<!-- Confirmation Action (Strictly 1 Solid Black CTA) -->
<div class="w-full flex justify-center mb-4">
<button class="w-full max-w-xs h-[52px] rounded-full bg-primary text-on-primary font-label-md text-label-md font-medium flex items-center justify-center transition-transform active:scale-[0.98]" type="button">
        Adjust my schedule
      </button>
</div>
<!-- Quiet Planar Divider -->
<div class="h-px bg-surface-container mx-4 my-2"></div>
<!-- Secondary Quiet Link -->
<div class="text-center pt-2 pb-6">
<button class="font-label-sm text-label-sm text-secondary hover:text-on-surface font-medium transition-colors" type="button">
        Skip — too basic (unlocks next task)
      </button>
</div>
</aside>
<script>
    (() => {
      const chips = document.querySelectorAll('.chip-option');
      chips.forEach((chip) => {
        chip.addEventListener('click', () => {
          chips.forEach((c) => {
            c.setAttribute('aria-checked', 'false');
            c.classList.remove('bg-surface-container', 'text-on-surface');
            c.classList.add('bg-surface-container-low', 'text-secondary');
          });
          chip.setAttribute('aria-checked', 'true');
          chip.classList.remove('bg-surface-container-low', 'text-secondary');
          chip.classList.add('bg-surface-container', 'text-on-surface');
        });
      });
    })();
  </script>
