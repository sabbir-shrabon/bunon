  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-full"><header class="fixed top-0 w-full z-50 bg-surface-container-lowest/80 backdrop-blur-xl border-b border-surface-variant/40 pt-safe"><div class="h-14 px-gutter flex items-center justify-between"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-start text-on-surface hover:text-primary transition-colors focus:outline-none" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface text-center flex-1 px-space-xs truncate font-semibold">Create Proof</h1><div class="w-11 h-11 flex items-center justify-end"></div></div></header><main class="flex-1 flex flex-col w-full bg-surface pt-14 pb-24"><div class="flex flex-col w-full pb-6">
<!-- Main Scrollable Column -->
<div class="flex flex-col w-full px-gutter gap-space-md">
<!-- 1. Attached Photo Preview Card -->
<div class="w-full bg-surface-container-lowest rounded-[20px] p-4 flex flex-col gap-3 transition-all duration-200" id="previewCard">
<div class="relative w-full h-[140px] rounded-xl overflow-hidden bg-surface-container flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="Clean minimalist interface wireframe code editor showing modern typography, monochrome authentication screen lines, subtle grey and off-white tones, studio lighting, hyper clean vector feel, high resolution" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzSzPwkibzTTmXYeOmr3I7eKJt7EPRXbXy_5KMcJ21TLyFdFnyaj1QOIZjGEEU3n6Yy8dJsgNL49DHPAMga0dOfv04RXJHhWF_8xhBet6WAhdpQ7S3DV19_ov8MQ-y8bCNMWuI_J0xJ1uWm1w6-3t2CGYZceR-ljQzx-u_FpWZEknA4X7sTAodVjpP1QrxUltKFSlrhxHV1x9BBNsihlexSelEiVhWuQKZvHkxkjE"/>
<!-- Close / Remove Button -->
<button aria-label="Remove attached photo" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-surface-container-lowest flex items-center justify-center text-on-surface hover:bg-surface transition-colors focus:outline-none" onclick="removePreview()" type="button">
<span class="material-symbols-outlined text-[16px] leading-none">close</span>
</button>
</div>
<div class="flex items-center justify-between text-on-surface-variant font-body-sm text-body-sm px-1">
<span class="font-medium text-on-surface truncate">login_auth_preview.png</span>
<span class="text-secondary shrink-0">1.2 MB</span>
</div>
</div>
<!-- 2. Multi-line Caption Card -->
<div class="w-full bg-surface-container-lowest rounded-[20px] p-5 flex flex-col">
<label class="sr-only" for="proofCaption">Proof description</label>
<textarea class="w-full min-h-[90px] bg-transparent text-on-surface placeholder:text-outline font-body-md text-body-md resize-none border-0 outline-none focus:ring-0 p-0" id="proofCaption" placeholder="What did you do, in one or two lines?" rows="4"></textarea>
<div class="flex items-center justify-between pt-2 border-t-0 text-on-surface-variant font-label-sm text-label-sm">
<span class="text-secondary">Markdown supported</span>
<span class="text-secondary" id="charCount">0 / 280</span>
</div>
</div>
<!-- 3. Add to Your Proof Grid Card -->
<div class="w-full bg-surface-container-lowest rounded-[20px] p-space-lg flex flex-col gap-3">
<div class="font-label-sm text-label-sm font-medium text-secondary">
        Add to your proof
      </div>
<div class="grid grid-cols-5 gap-2 w-full">
<!-- 1. Camera -->
<button class="flex flex-col items-center justify-center py-2.5 px-1 rounded-xl bg-surface-container-lowest hover:bg-surface-container transition-colors focus:outline-none group text-center" type="button">
<span class="material-symbols-outlined text-on-surface text-[20px] group-hover:scale-105 transition-transform">photo_camera</span>
<span class="mt-1 font-label-sm text-label-sm text-on-surface leading-tight">Camera</span>
</button>
<!-- 2. Gallery -->
<button class="flex flex-col items-center justify-center py-2.5 px-1 rounded-xl bg-surface-container-lowest hover:bg-surface-container transition-colors focus:outline-none group text-center" type="button">
<span class="material-symbols-outlined text-on-surface text-[20px] group-hover:scale-105 transition-transform">image</span>
<span class="mt-1 font-label-sm text-label-sm text-on-surface leading-tight">Gallery</span>
</button>
<!-- 3. Link -->
<button class="flex flex-col items-center justify-center py-2.5 px-1 rounded-xl bg-surface-container-lowest hover:bg-surface-container transition-colors focus:outline-none group text-center" type="button">
<span class="material-symbols-outlined text-on-surface text-[20px] group-hover:scale-105 transition-transform">link</span>
<span class="mt-1 font-label-sm text-label-sm text-on-surface leading-tight">Link</span>
</button>
<!-- 4. Video (Pro) -->
<button class="relative flex flex-col items-center justify-center py-2.5 px-1 rounded-xl bg-surface-container-lowest hover:bg-surface-container transition-colors focus:outline-none group text-center" type="button">
<span class="material-symbols-outlined text-on-surface text-[20px] group-hover:scale-105 transition-transform">videocam</span>
<span class="mt-1 font-label-sm text-label-sm text-on-surface leading-tight">Video</span>
<span class="mt-0.5 inline-block px-1.5 py-0.2 rounded-full bg-surface-container text-secondary text-[10px] font-medium leading-none">Pro</span>
</button>
<!-- 5. File (Pro) -->
<button class="relative flex flex-col items-center justify-center py-2.5 px-1 rounded-xl bg-surface-container-lowest hover:bg-surface-container transition-colors focus:outline-none group text-center" type="button">
<span class="material-symbols-outlined text-on-surface text-[20px] group-hover:scale-105 transition-transform">description</span>
<span class="mt-1 font-label-sm text-label-sm text-on-surface leading-tight">File</span>
<span class="mt-0.5 inline-block px-1.5 py-0.2 rounded-full bg-surface-container text-secondary text-[10px] font-medium leading-none">Pro</span>
</button>
</div>
</div>
<!-- 4. Optional Effort Check-in Card -->
<div class="w-full bg-surface-container-lowest rounded-[20px] p-space-lg flex flex-col gap-3" id="effortSection">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md font-medium text-on-surface">How did it feel?</span>
<button class="font-body-sm text-body-sm text-secondary hover:text-on-surface transition-colors focus:outline-none" onclick="dismissEffort()" type="button">
          Not useful
        </button>
</div>
<div class="flex items-center gap-2 pt-1">
<!-- Chip 1 -->
<button class="effort-chip flex-1 py-2 px-3 rounded-full bg-surface-container-low text-on-surface font-label-sm text-label-sm text-center transition-colors focus:outline-none" data-value="easy" onclick="selectEffort(this)" type="button">
          Too easy
        </button>
<!-- Chip 2 -->
<button class="effort-chip flex-1 py-2 px-3 rounded-full bg-surface-container-low text-on-surface font-label-sm text-label-sm text-center transition-colors focus:outline-none" data-value="balanced" onclick="selectEffort(this)" type="button">
          Just right
        </button>
<!-- Chip 3 -->
<button class="effort-chip flex-1 py-2 px-3 rounded-full bg-surface-container-low text-on-surface font-label-sm text-label-sm text-center transition-colors focus:outline-none" data-value="hard" onclick="selectEffort(this)" type="button">
          Too hard
        </button>
</div>
</div>
</div>
</div>
<script>
  function removePreview() {
    const preview = document.getElementById('previewCard');
    if (preview) {
      preview.style.opacity = '0';
      preview.style.transform = 'scale(0.98)';
      setTimeout(() => {
        preview.style.display = 'none';
      }, 150);
    }
  }

  function dismissEffort() {
    const effort = document.getElementById('effortSection');
    if (effort) {
      effort.style.opacity = '0';
      effort.style.transform = 'scale(0.98)';
      setTimeout(() => {
        effort.style.display = 'none';
      }, 150);
    }
  }

  function selectEffort(selectedBtn) {
    const chips = document.querySelectorAll('.effort-chip');
    chips.forEach(chip => {
      chip.classList.remove('bg-primary', 'text-on-primary');
      chip.classList.add('bg-surface-container-low', 'text-on-surface');
    });

    selectedBtn.classList.remove('bg-surface-container-low', 'text-on-surface');
    selectedBtn.classList.add('bg-primary', 'text-on-primary');
  }

  const captionInput = document.getElementById('proofCaption');
  const charDisplay = document.getElementById('charCount');
  if (captionInput && charDisplay) {
    captionInput.addEventListener('input', (e) => {
      const len = e.target.value.length;
      charDisplay.textContent = `${len} / 280`;
    });
  }
</script></main><aside class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/80 backdrop-blur-xl border-t border-surface-variant/40"><div class="h-20 px-gutter flex items-center justify-center"><button class="w-full h-[52px] rounded-full bg-primary text-on-primary font-label-md text-label-md font-medium flex items-center justify-center transition-opacity hover:opacity-90 active:opacity-95 focus:outline-none" type="button">Continue</button></div></aside></body></html>
